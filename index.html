<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIMESHOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2bd6;--green:#00e04f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#fff;color:#000;font:16px/1.4 Inter,Arial,sans-serif;overflow:hidden}
button,input{font:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #000;outline-offset:3px}

h1{position:fixed;top:24px;left:28px;margin:0;z-index:2;font:800 clamp(28px,5vw,56px)/1 Unbounded,'Arial Black',sans-serif;letter-spacing:-.03em;pointer-events:none}
.clock{position:fixed;inset:0;display:grid;place-items:center;padding-bottom:60px}
.clock svg{width:min(96vw,calc(100svh - 200px),760px);height:auto;overflow:visible}

#layer{position:fixed;inset:0;z-index:1;pointer-events:none}
.orb{position:absolute;width:var(--d);height:var(--d);border-radius:50%;border:0;padding:0;background:var(--c);cursor:pointer;pointer-events:auto}
.orb.big:has(img){background:none}
.orb img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}

#snap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:12px;height:64px;padding:0 30px 0 22px;
  border:0;border-radius:99px;background:#000;color:#fff;font:800 19px/1 Unbounded,'Arial Black',sans-serif;cursor:pointer;white-space:nowrap}
#snap img{height:44px;width:auto;filter:invert(1)}
.bang{font-size:1.2em;-webkit-text-stroke:1.5px currentColor}
#snap:disabled{opacity:.3}
#msg{position:fixed;left:0;right:0;bottom:100px;z-index:3;margin:0;text-align:center;font-size:14px}
#msg:empty{display:none}

dialog{border:0;padding:16px;background:#fff;max-width:100vw;max-height:100vh}
dialog::backdrop{background:#fff}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.x{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:#000;color:#fff;font-size:22px;cursor:pointer}
.time{font:800 20px Unbounded,'Arial Black',sans-serif}
#vImg{display:block;max-width:100%;max-height:calc(100vh - 140px);margin:0 auto}
#vNote{margin:12px 0 0;font-size:17px}
#pImg{display:block;max-width:100%;max-height:55vh;margin:0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.row input{flex:1 1 200px;height:52px;padding:0 20px;border:2px solid #000;border-radius:99px;font-size:16px}
.pill{height:52px;padding:0 26px;border:0;border-radius:99px;background:#000;color:#fff;font-weight:700;cursor:pointer}
.pill:disabled{opacity:.4}
</style>
</head>
<body>
<h1>TIMESHOT</h1>

<div class="clock">
  <svg id="clock" viewBox="-410 -410 820 820" aria-label="Clock">
    <rect x="-200" y="-200" width="400" height="400" fill="var(--pink)"/>
    <circle r="190" fill="#fff"/>
    <rect id="mm" x="-6" y="-200" width="12" height="250"/>
    <rect id="hh" x="-13" y="-120" width="26" height="165" fill="var(--green)"/>
    <rect id="ss" x="-1.5" y="-400" width="3" height="760"/>
    <rect x="-24" y="-24" width="48" height="48"/>
  </svg>
</div>

<div id="layer"></div>

<button id="snap" type="button"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGcAAACgCAYAAAARrHL1AAAOf0lEQVR42u2de5AU1RXGf7vLY3mILKKIaGBRUYNEUUw0ookiKsRoAEWjKMZXSHwHJTGYWLFiqYkxanxUIFZi1FKjEDUqogUIBBHfERR8oQKr8lLYhcWF3Z38cc9Utb09M90953b3zPZXdWthpqf79j19b597znfOqaB8UAEcDBwNjAQGArsANUALsAlYBbwCzAbmA/WksIpOwMnALGArkPHRWoEVwG+BfukQ2sGhwDyfAsnVVgMXA1XpcOrhSmBzkYJxtgeAnumwFodK4EZFoTjbf4HadIjD42ZLgsm2l4Fe6TAHx9nyMs9Ybo8AHdPh9o9vAhsiEEy2XZ0OuX88HKFgMsAXwD7psBfGEUBTxMLJAHekQ18Y/4hBMBlgLdAnHf7c6A2si0k4GeCcuG68QwkIZyDwMfBJnmOqRP39htjYNDES+Gc6R8hp0PRzTA3G6PkQxtCpNXOWiv0uhRJ+AjQqCWc9sEc6pLq4REk4TcCgdDh1UQUsUBBOMzA4VQgMhgAjgM4yOPgwhNYDT2GcaVm0yIv8KNfx60TBWC3HVAN7A/2B7h7n/wrYlj7rsL+s8WFf3L08/D0ZYAfwH2Ac0NdDyegM7ItxQ7zmOu/nwO6paOC8IpegI13n2w94CRgVoA/VwOWOh2SZfNbucVGRwvme63xdgJ1C9uUgYKWo5ukm1OMdcwswN4cLuQWYCJye5/f53hUdZf+yDeOGcON/GG5C31Q43ngZQ9zIhW8TjgwyTjSwzqJMLJEZssh1/DJpqXB8zKSg3ztxAHAXcIzHd8NkSb0X+GVSKFNJF86FHu8RJw4PIJhngAEFlrlJwJ6yVDamKoBdhSCrfS0MeJ6/pKJoizOKFM6hHuc8PcR5WlyKRgoMffYFMZm0UNi6nD2mCcM76+xxzhkhBf05qU0NL/P/INGmholJxmvwFmNIH4MxPh8vdMHQbsPOxDlxugs6xDT4Q/LsH1pl5mRkcKvyqMV95LgKMb/UuVTfjkC3Ivp6LDAN2IjhVH8l+5/ZwDuUocv533KTNlzKMz1sZsssXKcBuFuW4bLBHSEHY4MsT68D72PCOXItdZWuaz5gkV+wOE4LAsqhGstpG4qRz48yQ3bze8osqJSlrhZDvJhLW66ZO6RjlGWW6BMlwsXIi24YH4rTxH8EcBKGguS84eXACT7fmRNEs8r+9izaOt0et8zQGVsOwnFqXtc4vnvU8fkiYK+A5x4KfCC/n+extA0E1lgUzsJSnz1u4SzCeCCHYWhPGeBDjEfSjcEYX89kmRleZpjvYuJ1WoBTPb4fg3G62RBOC4ZCVTbCyYiBcZvj/eMe1D4Ytqc7nHAjcBPQ1XX8tfL9+zmYmn+yOHuetMCZi1U4GddM6uCyFrxI4VANp1Wgl2MWPuQxWN3kOjaE0wQcVq7CucJ1/G0+B+Vnrt9Nc3x3cY4l0lYoyX3lKJwd8u7JYnf8Ez3ecJlYznR8tznH0zzRknrdgOEtJBqDMT4Uv8L50qUIjAgwIFtEscjiaNfAv453IO50S7PnVhSDXzWxK3A9JvD18AC/2wFsd/y/a8DNrZMd0+jykA7FxJG6MUXsZNqYkLTcBl2Anzr2GhnppN+Zs9W1HBziMH4GjaE5Ee+kEGfjzUGotzB7rk2KYE7CECTcHZwQUCEY5fJevuFzIB6lbX6CXIT0Az36f5kF4XyEiXqIDYcVMIsEFc6druPH+nC21dPW+/l8nuMfx5tT/S8LApoUh1BqgXt8hFh4CWct+T2P7rV6ch73wkbgNNfx3ynQr0U57ml34D1l4bwly30kqBF72FqfnZtIW9/KfaIsvCWmmjqxJGffL3/zcK59X5aujzEk9PdF0xpCW/bMswX6tID8jrVtygIaH4WpfyLG8+d3vb23 <input type="file" id="file" accept="image/*" hidden>

<!-- after the shot: add a note and post -->
<dialog id="poster">
  <div class="head"><span></span><button class="x" data-close type="button" aria-label="Close">×</button></div>
  <img id="pImg" alt="">
  <div class="row">
    <input id="memo" maxlength="80" placeholder="Note" autocomplete="off">
    <button class="pill" id="post" type="button">Post</button>
  </div>
</dialog>

<!-- tap a circle: the photo at its own size -->
<dialog id="viewer">
  <div class="head"><span class="time" id="vTime"></span><button class="x" data-close type="button" aria-label="Close">×</button></div>
  <img id="vImg" alt="">
  <p id="vNote"></p>
</dialog>

<script>
/* ===== Shared storage for GitHub Pages: paste your Supabase project values here (see README) ===== */
const SB_URL = '';   // e.g. https://abcd1234.supabase.co
const SB_KEY = '';   // the "anon public" key
/* ================================================================================================ */

const $ = id => document.getElementById(id);
const NEON = ['#ff2bd6', '#39ff14', '#ff5e00', '#00e5ff', '#f2ff00', '#7a2bff', '#ff1744', '#0047ff'];
const pad = n => String(n).padStart(2, '0');
const dayOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hash = s => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
const color = id => NEON[(hash(id + "#c") >>> 11) % NEON.length];
const msg = t => { $('msg').textContent = t; };

let shots = new Map(), store = null, me = null;

/* ---------- three small stores: Claude link, Supabase, or this browser ---------- */
function localStore() {
  const K = 'timeshot-v2', read = () => { try { return JSON.parse(localStorage.getItem(K)) || []; } catch (e) { return []; } };
  return {
    watch(day, cb) { cb(read().filter(s => s.day === day)); },
    async add(s, img) { const all = read().filter(x => x.id !== s.id).filter(x => x.day === s.day); all.push({ ...s, img }); localStorage.setItem(K, JSON.stringify(all)); },
    async full(id) { const s = read().find(x => x.id === id); return s && s.img; }
  };
}
function supabaseStore() {
  const H = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
  const T = SB_URL + '/rest/v1/shots';
  return {
    watch(day, cb) {
      let since = 0;
      const pull = async () => {
        try {
          const r = await fetch(`${T}?select=id,uid,day,hour,at,memo,thumb&day=eq.${day}&at=gt.${since}&order=at`, { headers: H });
          const rows = await r.json();
          if (Array.isArray(rows) && rows.length) { since = rows[rows.length - 1].at; cb(rows, true); }
          msg('');
        } catch (e) { msg('Offline'); }
      };
      pull(); return setInterval(pull, 15000);              // check for new snaps every 15 s
    },
    async add(s, img) {
      const r = await fetch(T, { method: 'POST', headers: { ...H, Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ ...s, img }) });
      if (!r.ok) throw new Error('post');
    },
    async full(id) { const r = await fetch(`${T}?select=img&id=eq.${encodeURIComponent(id)}`, { headers: H }); const j = await r.json(); return j[0] && j[0].img; }
  };
}
function claudeStore(db) {
  return {
    watch(day, cb) { return db.collection('shots').where('day', '==', day).onSnapshot(q => cb(q.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }))), () => msg('Offline')); },
    async add(s, img) { await db.doc('full/' + s.id).set({ img }); await db.doc('shots/' + s.id).set(s); },
    async full(id) { const d = await db.doc('full/' + id).get(); return d.exists ? d.data().img : null; }
  };
}

/* ---------- clock ---------- */
function tick() {
  const n = new Date(), h = n.getHours() % 12, m = n.getMinutes(), s = n.getSeconds();
  $('hh').setAttribute('transform', `rotate(${(h + m / 60) * 30})`);
  $('mm').setAttribute('transform', `rotate(${(m + s / 60) * 6})`);
  $('ss').setAttribute('transform', `rotate(${s * 6})`);
}

/* ---------- circles: random but stable spots, kept apart, never moving ---------- */
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function clearance(x, y, r, b) { const dx = Math.max(b[0] - x, 0, x - b[0] - b[2]), dy = Math.max(b[1] - y, 0, y - b[1] - b[3]); return Math.hypot(dx, dy) - r; }
function render() {
  const W = innerWidth, H = innerHeight, now = new Date(), hour = now.getHours(), today = dayOf(now);
  const BIG = Math.round(Math.min(160, Math.max(96, Math.min(W, H) * .17))), SMALL = 36;
  const c = $('clock').getBoundingClientRect(), sq = c.width * 400 / 820;
  const keepOut = [[c.left + c.width / 2 - sq / 2, c.top + c.height / 2 - sq / 2, sq, sq], [0, 0, Math.min(W, 380), 90], [W / 2 - 140, H - 100, 280, 100]];
  const placed = [], layer = $('layer');
  layer.textContent = '';
  [...shots.values()].sort((a, b) => a.at - b.at).forEach(s => {
    const big = s.day === today && s.hour === hour, d = big ? BIG : SMALL, r = d / 2, rand = rng(hash(s.id));
    let best = [0, 0], score = -1e9;
    for (let t = 0; t < 80 && score < 14; t++) {
      const x = r + rand() * (W - d), y = r + rand() * (H - d);
      let sc = Infinity;
      for (const p of placed) sc = Math.min(sc, Math.hypot(p[0] - x, p[1] - y) - p[2] - r);
      for (const b of keepOut) sc = Math.min(sc, clearance(x, y, r, b));
      if (sc > score) { score = sc; best = [x, y]; }
    }
    placed.push([best[0], best[1], r]);
    const b = document.createElement('button');
    b.className = 'orb' + (big ? ' big' : '');
    b.style.cssText = `--d:${d}px;--c:${color(s.id)};left:${best[0] - r}px;top:${best[1] - r}px`;
    b.setAttribute('aria-label', 'Snap ' + s.hour + 'h');
    if (big && /^data:image\//.test(s.thumb)) { const im = new Image(); im.src = s.thumb; im.alt = ''; b.append(im); }
    b.onclick = () => openViewer(s);
    layer.append(b);
  });
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });

/* ---------- snap: pick a photo (phones offer the camera here) ---------- */
let picked = null;
function shrink(src, w, h, max, square, q) {
  const c = document.createElement('canvas'), x = c.getContext('2d');
  let sx = 0, sy = 0, sw = w, sh = h;
  if (square) { const m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; c.width = c.height = max; }
  else { const k = Math.min(1, max / Math.max(w, h)); c.width = Math.round(w * k); c.height = Math.round(h * k); }
  x.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function take(src, w, h) {
  let img = shrink(src, w, h, 1600, false, .82);
  for (let m = 1400; img.length > 200000 && m >= 800; m -= 200) img = shrink(src, w, h, m, false, .75);
  picked = { img, thumb: shrink(src, w, h, 320, true, .72) };
  $('pImg').src = img; $('memo').value = ''; $('post').disabled = false; $('poster').showModal();
}
$('snap').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const im = new Image();
  im.onload = () => { take(im, im.naturalWidth, im.naturalHeight); URL.revokeObjectURL(im.src); };
  im.src = URL.createObjectURL(f);
};
$('post').onclick = async () => {
  if (!picked) return;
  const n = new Date(), day = dayOf(n), hour = n.getHours();
  const s = { id: day + '_' + pad(hour) + '_' + String(me).replace(/[^\w-]/g, '_').slice(0, 60), uid: me, day, hour, at: n.getTime(), memo: $('memo').value.trim().slice(0, 80), thumb: picked.thumb };
  $('post').disabled = true;
  try { await store.add(s, picked.img); shots.set(s.id, s); render(); $('poster').close(); picked = null; }
  catch (e) { $('post').disabled = false; msg('Could not post'); }
};
$('memo').onkeydown = e => { if (e.key === 'Enter') $('post').click(); };

/* ---------- viewer ---------- */
async function openViewer(s) {
  const t = new Date(s.at);
  $('vTime').textContent = pad(t.getHours()) + ':' + pad(t.getMinutes());
  $('vNote').textContent = s.memo || '';
  $('vImg').src = s.thumb || ''; $('viewer').showModal();
  try { const img = await store.full(s.id); if (img && /^data:image\//.test(img)) $('vImg').src = img; } catch (e) {}
}
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());

/* ---------- start ---------- */
let day = dayOf(new Date()), hourNow = new Date().getHours(), stop = null;
function watch() {
  shots = new Map(); render();
  if (typeof stop === 'function') stop(); else clearInterval(stop);
  stop = store.watch(day, (rows, add) => {
    if (!add) shots = new Map();
    rows.forEach(r => { if (r && typeof r.hour === 'number') shots.set(r.id, r); });
    render();
  });
}
setInterval(() => {
  tick();
  const n = new Date();
  if (dayOf(n) !== day) { day = dayOf(n); hourNow = n.getHours(); watch(); }
  else if (n.getHours() !== hourNow) { hourNow = n.getHours(); render(); }   // past hour: big photo becomes a small dot
}, 1000);
tick();

(async () => {
  let db = null, user = null;
  if (window.claude && window.claude.use) [db, user] = await Promise.all([window.claude.use('db').catch(() => null), window.claude.use('user').catch(() => null)]);
  if (user) { try { me = await user.id(); } catch (e) {} try { if (await user.can('data.write') === false) $('snap').disabled = true; } catch (e) {} }
  if (!me) { try { me = localStorage.getItem('timeshot-me') || Math.random().toString(36).slice(2, 10); localStorage.setItem('timeshot-me', me); } catch (e) { me = Math.random().toString(36).slice(2, 10); } }
  store = db ? claudeStore(db) : SB_URL ? supabaseStore() : localStore();
  watch();
})();
</script>
