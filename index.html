<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIMESHOT</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #fff; color: #000; font: 16px/1.4 -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
button, input { font: inherit; }

h1 { position: fixed; top: 24px; left: 28px; z-index: 2; margin: 0; font-size: clamp(28px, 5vw, 48px); line-height: 1; letter-spacing: -.02em; pointer-events: none; }

#clock { position: fixed; inset: 0; margin: auto; width: min(96vw, calc(100svh - 200px), 760px); height: min(96vw, calc(100svh - 200px), 760px); top: -60px; }

#dots { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.dot { position: absolute; border: 0; padding: 0; border-radius: 50%; background: #e6e6e6 center / cover; cursor: pointer; pointer-events: auto; }

#cam { position: fixed; top: 16px; right: 16px; z-index: 3; width: min(300px, 34vw); aspect-ratio: 4 / 3; background: #111; object-fit: cover; transform: scaleX(-1); }

#snap { position: fixed; left: 50%; bottom: 24px; z-index: 3; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 30px 0 22px; border: 0; border-radius: 99px; background: #000; color: #fff; font-size: 19px; font-weight: 700; cursor: pointer; }
#snap img { height: 44px; filter: invert(1); }
#snap:active, #snap.on { background: #ff2bd6; }

dialog { border: 0; padding: 16px; max-width: 100vw; max-height: 100vh; }
dialog::backdrop { background: #fff; }
dialog img { display: block; max-width: 100%; max-height: calc(100vh - 160px); margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.x { width: 48px; height: 48px; border: 0; border-radius: 50%; background: #000; color: #fff; font-size: 22px; cursor: pointer; }
#time { font-size: 32px; font-weight: 700; }
#note { margin: 12px 0 0; font-size: 17px; }
.row { display: flex; gap: 8px; margin-top: 16px; }
#memo { flex: 1; min-width: 0; height: 52px; padding: 0 20px; border: 2px solid #000; border-radius: 99px; }
#post { height: 52px; padding: 0 26px; border: 0; border-radius: 99px; background: #000; color: #fff; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

  <rect id="hh" x="-13" y="-120" width="26" height="165" fill="#00e04f"/>
  <rect id="ss" x="-1.5" y="-400" width="3" height="760"/>
  <rect x="-24" y="-24" width="48" height="48"/>

<input type="file" id="file" accept="image/*" hidden>

<dialog id="poster">
  <div class="top"><span></span><button class="x">×</button></div>
  <img id="shot" alt="">
  <div class="row"><input id="memo" maxlength="80" placeholder="Note" autocomplete="off"><button id="post">Post</button></div>
</dialog>

<dialog id="viewer">
  <div class="top"><span id="time"></span><button class="x">×</button></div>
  <img id="big" alt="">
  <p id="note"></p>
</dialog>

<script>
// supabase
const URL_ = 'https://bcufecjgawlivtkjsqbn.supabase.co/rest/v1/shots';
const KEY = 'sb_publishable_2uikYVj8L1mBdyChWs_RQQ_lVtU4XJu';
const H = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

let me = localStorage.getItem('timeshot-me');
if (!me) { me = Math.random().toString(36).slice(2, 10); localStorage.setItem('timeshot-me', me); }

let day = today(), shots = [], since = 0, picked = null;


// clock
function tick() {
  const n = new Date(), h = n.getHours() % 12, m = n.getMinutes(), s = n.getSeconds();
  $('hh').setAttribute('transform', `rotate(${(h + m / 60) * 30})`);
  $('mm').setAttribute('transform', `rotate(${(m + s / 60) * 6})`);
  $('ss').setAttribute('transform', `rotate(${s * 6})`);
}
tick();
setInterval(tick, 1000);


// photos: honeycomb around the clock, from 12 o'clock outward, smaller near the edges
function hits(x, y, r, b) {
  return x + r > b[0] && x - r < b[0] + b[2] && y + r > b[1] && y - r < b[1] + b[3];
}

function spots(d) {
  const W = innerWidth, H = innerHeight, c = $('clock').getBoundingClientRect();
  const cx = c.left + c.width / 2, cy = c.top + c.height / 2, R = c.width * 190 / 820;
  const gap = d * .12, step = d + gap, rowH = step * .866, n = Math.ceil(Math.max(W, H) / rowH);
  const v = $('cam').getBoundingClientRect();
  const avoid = [[0, 0, 300, 80], [W / 2 - 140, H - 100, 280, 100], [v.left - 8, v.top, v.width + 8, v.height + 8]];
  const out = [];
  for (let j = -n; j <= n; j++) {
    for (let i = -n; i <= n; i++) {
      const x = cx + (i + (j & 1) / 2) * step, y = cy + j * rowH, dist = Math.hypot(x - cx, y - cy);
      const size = d * Math.min(1, Math.min(x, y, W - x, H - y) / d);
      if (dist < R + gap + d / 2 || size < d * .4 || avoid.some(b => hits(x, y, size / 2, b))) continue;
      out.push({ x, y, size, ring: Math.round(dist / step), ang: (Math.atan2(x - cx, cy - y) + 2 * Math.PI) % (2 * Math.PI) });
    }
  }
  return out.sort((a, b) => a.ring - b.ring || a.ang - b.ang);
}

function render() {
  let d = Math.round(Math.min(110, Math.max(64, Math.min(innerWidth, innerHeight) * .14)));
  let pts = spots(d);
  while (pts.length < shots.length && d > 24) pts = spots(d = Math.round(d * .88));

  $('dots').replaceChildren(...shots.slice(0, pts.length).map((s, k) => {
    const p = pts[k], b = document.createElement('button');
    b.className = 'dot';
    b.style.cssText = `width:${p.size}px;height:${p.size}px;left:${p.x - p.size / 2}px;top:${p.y - p.size / 2}px`;
    if (/^data:image\/jpeg;base64,[\w+/=]+$/.test(s.thumb)) b.style.backgroundImage = `url("${s.thumb}")`;
    b.onclick = () => show(s);
    return b;
  }));
}
let wait;
addEventListener('resize', () => { clearTimeout(wait); wait = setTimeout(render, 150); });


// load today's photos, then check for new ones every 15 s
async function pull() {
  if (today() !== day) { day = today(); shots = []; since = 0; render(); }
  try {
    const r = await fetch(`${URL_}?select=id,at,memo,thumb&day=eq.${day}&at=gt.${since}&order=at`, { headers: H });
    const rows = await r.json();
    if (!rows.length) return;
    since = rows[rows.length - 1].at;
    const ids = new Set(rows.map(r => r.id));
    shots = shots.filter(s => !ids.has(s.id)).concat(rows);
    render();
  } catch (e) {}
}
pull();
setInterval(pull, 15000);


// camera
const cam = $('cam');
navigator.mediaDevices?.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1920 } }, audio: false })
  .then(s => { cam.srcObject = s; })
  .catch(() => { cam.hidden = true; render(); });

function jpg(src, w, h, max, square, q, flip) {
  const c = document.createElement('canvas'), x = c.getContext('2d');
  let sx = 0, sy = 0, sw = w, sh = h;
  if (square) { const m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; c.width = c.height = max; }
  else { const k = Math.min(1, max / Math.max(w, h)); c.width = w * k; c.height = h * k; }
  if (flip) { x.translate(c.width, 0); x.scale(-1, 1); }
  x.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

function take(src, w, h, flip) {
  let img = jpg(src, w, h, 1600, false, .82, flip);
  for (let m = 1400; img.length > 300000 && m >= 800; m -= 200) img = jpg(src, w, h, m, false, .75, flip);
  picked = { img, thumb: jpg(src, w, h, 240, true, .7, flip) };
  $('shot').src = picked.img;
  $('memo').value = '';
  $('post').disabled = false;
  $('post').textContent = 'Post';
  $('poster').showModal();
}

$('snap').onclick = () => {
  $('snap').classList.add('on');
  setTimeout(() => $('poster').open || $('snap').classList.remove('on'), 300);
  if (cam.videoWidth) take(cam, cam.videoWidth, cam.videoHeight, true);
  else $('file').click();
};
$('poster').onclose = () => $('snap').classList.remove('on');

$('file').onchange = e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const im = new Image();
  im.onload = () => take(im, im.naturalWidth, im.naturalHeight, false);
  im.src = URL.createObjectURL(f);
};


// post
$('post').onclick = async () => {
  const n = new Date();
  const s = { id: day + '_' + pad(n.getHours()) + '_' + me, uid: me, day, hour: n.getHours(), at: n.getTime(), memo: $('memo').value.trim(), thumb: picked.thumb };
  $('post').disabled = true;
  const r = await fetch(URL_, { method: 'POST', headers: { ...H, Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ ...s, img: picked.img }) }).catch(() => null);
  if (!r || !r.ok) { $('post').disabled = false; $('post').textContent = 'Try again'; return; }
  shots = shots.filter(x => x.id !== s.id).concat(s);
  render();
  $('poster').close();
};
$('memo').onkeydown = e => { if (e.key === 'Enter') $('post').click(); };


// tap a photo: time + full photo
async function show(s) {
  const t = new Date(s.at);
  $('time').textContent = pad(t.getHours()) + ':' + pad(t.getMinutes());
  $('note').textContent = s.memo || '';
  $('big').src = s.thumb || '';
  $('viewer').showModal();
  const r = await fetch(`${URL_}?select=img&id=eq.${encodeURIComponent(s.id)}`, { headers: H }).then(r => r.json()).catch(() => []);
  if (r[0]?.img?.startsWith('data:image/')) $('big').src = r[0].img;
}

document.querySelectorAll('.x').forEach(b => b.onclick = () => b.closest('dialog').close());
</script>
</body>
</html>
